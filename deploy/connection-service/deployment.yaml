apiVersion: apps/v1
kind: Deployment
metadata:
  name: connection-service
  labels:
    app.kubernetes.io/name: connection-service
spec:
  # RuntimeMcpSseSessions and SQLite state are process-local. Do not increase.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: connection-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: connection-service
    spec:
      serviceAccountName: connection-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: connection-service
          image: registry.example.com/connection-service:replace-with-immutable-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3400
          envFrom:
            - configMapRef:
                name: connection-service
          env:
            - name: CONNECTION_SERVICE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: connection-service-secrets
                  key: auth-secret
            - name: CONNECTION_SERVICE_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: connection-service-secrets
                  key: encryption-key
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /app/data/connection-service
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: connection-service-data
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
