openapi: 3.1.0
info:
  title: Data Workshop V1 V3 OpenConnector API
  version: 3.0.0
  description: Canonical control-plane and unified MCP contract. Publication resources do not exist.
servers:
  - url: https://{openconnector-domain}
    variables:
      openconnector-domain:
        default: configured.example.invalid
security:
  - adminBearer: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
  /ready:
    get:
      operationId: getReadiness
      security: []
      responses:
        "200":
          description: State store, Provider registry, Identity, and JWKS dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        "503":
          $ref: "#/components/responses/Error"
  /v1/providers:
    get:
      operationId: listProviders
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /v1/connections:
    get:
      operationId: listConnections
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      operationId: createConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [provider_id, display_name, configuration]
              properties:
                provider_id: { type: string }
                display_name: { type: string }
                configuration: { type: object }
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateConnection
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required: [id, version]
              properties:
                id: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/connections/{connectionId}:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    get:
      operationId: getConnection
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/connections/{connectionId}:validate:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      operationId: validateConnection
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/connections/{connectionId}:discover:
    parameters:
      - $ref: "#/components/parameters/ConnectionId"
    post:
      operationId: discoverConnection
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/actions:
    get:
      operationId: listActions
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /v1/actions/{actionId}:invoke:
    parameters:
      - name: actionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: invokeActionAsAdministrator
      description: Administrative debugger only; it is not the user MCP data plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection_id, input]
              properties:
                connection_id: { type: string }
                input: { type: object }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/traces:
    get:
      operationId: listTraces
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /v1/traces/{traceId}:
    get:
      operationId: getTrace
      parameters:
        - name: traceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/identity-provider:
    get:
      operationId: getIdentityProvider
      responses:
        "200":
          description: Non-sensitive Identity Provider configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderEnvelope"
    put:
      operationId: putIdentityProvider
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas.json#/$defs/IdentityProviderConfig"
      responses:
        "200":
          description: Saved non-sensitive Identity Provider configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityProviderEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/identity-provider:validate:
    post:
      operationId: validateIdentityProvider
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/identity/subjects:
    get:
      operationId: searchIdentitySubjects
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: subject_type
          in: query
          schema: { enum: [user, group] }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/access-grants:
    get:
      operationId: listAccessGrants
      parameters:
        - name: connection_id
          in: query
          schema: { type: string }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
    post:
      operationId: createAccessGrant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas.json#/$defs/AccessGrant"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateAccessGrant
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id, version]
              properties:
                id: { type: string }
                role_id: { enum: [reader, operator, custom] }
                effect: { enum: [allow, deny] }
                action_scope:
                  type: array
                  uniqueItems: true
                  items: { type: string }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/access-grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/GrantId"
    get:
      operationId: getAccessGrant
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/access-grants/{grantId}:revoke:
    post:
      operationId: revokeAccessGrant
      parameters:
        - $ref: "#/components/parameters/GrantId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /v1/access:preview:
    post:
      operationId: previewAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas.json#/$defs/AccessPreviewRequest"
      responses:
        "200":
          description: Explained effective access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessPreviewEnvelope"
        default:
          $ref: "#/components/responses/Error"
  /v1/access/audit:
    get:
      operationId: listAccessAudit
      parameters:
        - name: connection_id
          in: query
          schema: { type: string }
        - name: subject_id
          in: query
          schema: { type: string }
        - name: decision
          in: query
          schema: { enum: [allow, deny] }
        - name: page_token
          in: query
          schema: { type: string }
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /v1/mcp/config:
    get:
      operationId: getMcpConfig
      description: Returns non-sensitive endpoint, protocol, and OAuth metadata.
      responses:
        "200":
          $ref: "#/components/responses/Success"
  /v1/mcp/status:
    get:
      operationId: getMcpStatus
      description: Returns endpoint, Identity, and JWKS readiness without secrets.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "503":
          $ref: "#/components/responses/Error"
  /mcp:
    post:
      operationId: invokeMcp
      description: Unified MCP Streamable HTTP data plane. Authenticate and authorize every request.
      security:
        - oauthBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { const: "2.0" }
                id: {}
                method: { type: string }
                params: { type: object }
      responses:
        "200":
          description: MCP JSON-RPC or streaming response.
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      description: Administrative control-plane identity; never exposed to the browser.
    oauthBearer:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://{agent-identity-domain}/oauth/authorize
          tokenUrl: https://{agent-identity-domain}/oauth/token
          scopes:
            openconnector.invoke: Invoke authorized Connection Actions.
  parameters:
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: string }
    GrantId:
      name: grantId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 256 }
  responses:
    Success:
      description: Successful operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SuccessEnvelope"
    Error:
      description: Standard redacted failure.
      content:
        application/json:
          schema:
            $ref: "./schemas.json#/$defs/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      $ref: "./schemas.json#/$defs/SuccessEnvelope"
    IdentityProviderEnvelope:
      allOf:
        - $ref: "./schemas.json#/$defs/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "./schemas.json#/$defs/IdentityProviderConfig"
    AccessPreviewEnvelope:
      allOf:
        - $ref: "./schemas.json#/$defs/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "./schemas.json#/$defs/AccessPreviewResult"
